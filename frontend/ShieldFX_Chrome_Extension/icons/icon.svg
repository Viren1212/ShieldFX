<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Shield Path -->
  <path d="M64 12 L108 28 C108 80, 64 116, 64 116 C64 116, 20 80, 20 28 Z" fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="5" filter="url(#glow)"/>
  <!-- Lightning Bolt -->
  <path d="M68 32 L44 68 L62 68 L56 96 L84 56 L66 56 Z" fill="url(#boltGrad)" stroke="#b45309" stroke-width="1.5"/>
</svg>